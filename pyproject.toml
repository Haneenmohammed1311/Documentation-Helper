readme = "README.md"
authors = [
    { name = "Haneen Mohammed", email = "haneeenmohammid@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-tavily>=0.2.18",
